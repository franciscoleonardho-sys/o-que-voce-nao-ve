<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O que você não vê - Exposição Digital</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    /* RESET & DESIGN GLOBAL */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-color: #080808;
      --card-bg: #121212;
      --accent-color: #c9a050;
      --text-color: #ececec;
      --text-muted: #a0a0a0;
      --font-main: 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-main);
      overflow-x: hidden;
    }

    /* HEADER COM NOVO ESTILO */
    header { padding: 60px 20px 30px; text-align: center; }
    header h2 { 
      font-family: 'Arial Narrow', sans-serif; 
      font-size: 2.2rem; 
      font-weight: 700; 
      letter-spacing: 2px; 
      text-transform: uppercase; 
      color: #ffffff; 
      margin: 0;
    }
    header p { 
      color: var(--accent-color); 
      margin-top: 10px; 
      font-size: 1.1rem; 
      letter-spacing: 1px; 
      font-weight: 300;
    }

    /* TELA DE ENTRADA */
    #welcome-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.88), rgba(0,0,0,0.94)), url('https://cdn.jsdelivr.net/gh/franciscoleonardho-sys/o-que-voce-nao-ve@main/Janela%20no%20fim%20da%20tarde.jpg') center/cover no-repeat;
      display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
      padding: 30px 20px; z-index: 1000; transition: opacity 0.8s ease, visibility 0.8s;
    }
    #welcome-screen.hidden { opacity: 0; visibility: hidden; }

    /* BOTÃO HOME */
    .btn-floating-home {
      position: fixed; top: 18px; left: 18px; width: 44px; height: 44px;
      background: rgba(18, 18, 18, 0.45); backdrop-filter: blur(10px);
      border: 1px solid rgba(201, 160, 80, 0.6); color: var(--accent-color);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 600; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    /* GALERIA E CARDS */
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 40px; max-width: 1100px; margin: 0 auto; padding: 40px 20px 60px; }
    .photo-card { background: var(--card-bg); border-radius: 4px; overflow: hidden; border: 1px solid #1a1a1a; display: flex; flex-direction: column; }
    .photo-card img { width: 100%; height: 300px; object-fit: cover; }
    .photo-info { padding: 22px; flex-grow: 1; }
    .photo-title { font-size: 1.15rem; color: var(--accent-color); margin-bottom: 10px; }
    .heart-svg { width: 18px; height: 18px; fill: none; stroke: #ffffff; stroke-width: 2; transition: all 0.3s; }
    .btn-like.liked .heart-svg { fill: var(--accent-color); stroke: var(--accent-color); }

    /* COMPONENTES DE ÁUDIO E LIGHTBOX MANTIDOS IGUAIS AO ANTERIOR */
    .audio-player-container { position: fixed; bottom: 25px; right: 25px; background: rgba(18, 18, 18, 0.75); backdrop-filter: blur(12px); border: 1px solid #333; border-radius: 40px; padding: 12px 24px; display: flex; align-items: center; gap: 15px; z-index: 500; }
    .lightbox { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.96); display: flex; justify-content: center; align-items: center; z-index: 2000; opacity: 0; pointer-events: none; }
    .lightbox.active { opacity: 1; pointer-events: auto; }
    .comment-item { background: #111; padding: 12px 14px; border-radius: 4px; border-left: 2px solid var(--accent-color); margin-bottom: 10px; }
  </style>
</head>
<body>

  <button class="btn-floating-home" onclick="openWelcomeScreen()">
    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
  </button>

  <div id="welcome-screen">
    <h1>O que você não vê</h1>
    <button class="btn-enter" onclick="enterExhibition()" style="margin-top: 20px; background: transparent; border: 1px solid var(--accent-color); color: var(--accent-color); padding: 10px 30px; cursor: pointer;">Entrar na Exposição</button>
  </div>

  <header>
    <h2>O que você não vê</h2>
    <p>Pessoas, rastros e histórias comuns</p>
  </header>

  <main class="gallery-grid" id="gallery"></main>

  <script>
    // [MANTER A MESMA LÓGICA DE FIREBASE E FUNÇÕES ANTERIOR...]
    // (O restante do seu script funcional permanece aqui)
    function enterExhibition() { document.getElementById('welcome-screen').classList.add('hidden'); }
    function openWelcomeScreen() { document.getElementById('welcome-screen').classList.remove('hidden'); }
  </script>
</body>
</html>
